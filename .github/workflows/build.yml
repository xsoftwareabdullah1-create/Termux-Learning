name: Build Termux Learn
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build target
        required: true
        type: choice
        options: [android, ios, all]
        default: android
  push:
    branches: [main]
    paths: ['app/**','components/**','data/**','lib/**','package.json','app.json','eas.json','.github/workflows/build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm install --global eas-cli
      - name: Verify Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: test -n "$EXPO_TOKEN" || (echo "Add EXPO_TOKEN in repository Actions secrets" && exit 1)
      - name: Build Android APK
        if: github.event_name == 'push' || github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all'
        env: &build_env
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > android-build.json
          URL=$(node -e "const x=require('./android-build.json'); console.log(x.artifacts?.buildUrl || x[0]?.artifacts?.buildUrl || '')")
          test -n "$URL"
          mkdir -p dist
          curl -fL "$URL" -o dist/Termux-Learn.apk
      - name: Build iOS IPA
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all')
        env: *build_env
        run: |
          eas build --platform ios --profile production --non-interactive --wait --json > ios-build.json
          URL=$(node -e "const x=require('./ios-build.json'); console.log(x.artifacts?.buildUrl || x[0]?.artifacts?.buildUrl || '')")
          test -n "$URL"
          mkdir -p dist
          curl -fL "$URL" -o dist/Termux-Learn.ipa
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('dist/*') != ''
        with:
          name: Termux-Learn-${{ github.run_number }}
          path: dist/*
          retention-days: 14
