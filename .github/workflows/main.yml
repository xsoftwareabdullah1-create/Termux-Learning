name: Build App

on:
  workflow_dispatch: # Allows you to manually trigger the build on GitHub
  push:
    branches: [ main ] # Automatically triggers when code is pushed to the main branch
jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ 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 }}   # ✅ Correct: secrets at job level
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive --no-wait
